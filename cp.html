<!DOCTYPE html>
<html lang="pt-AO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }


        /* CONTAINER PRINCIPAL */

        .conteiner {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        /* RETÂNGULO */

        .retangulo {
            width: 100%;
            max-width: 900px;
            min-height: 650px;

            background-color: black;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px;
        }


        /* TELA */

        .tela {
            width: 100%;
            max-width: 800px;
            min-height: 180px;

            background-color: white;

            border-radius: 20px;

            margin: 0;

            display: flex;
            flex-direction: column;

            padding: 20px;

            overflow: hidden;
        }


        /* CÁLCULO */

        .calculo {
            margin: 0;
            color: black;

            font-size: clamp(20px, 4vw, 30px);

            word-break: break-word;

            text-align: right;
        }


        /* RESULTADO */

        .resultado {
            margin: auto 0 0 0;

            color: black;

            font-size: clamp(28px, 6vw, 45px);

            font-weight: bold;

            text-align: right;

            word-break: break-word;
        }


        /* BOTÕES */

        .botoes {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;

            width: 100%;

            max-width: 770px;

            margin: 30px 0 0 0;

        }


        /* BOTÃO */

        button {

            width: 100%;

            min-height: 70px;

            background-color: rgb(0, 153, 255);

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(18px, 3vw, 24px);

            font-weight: bold;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.15s;

        }


        button:hover {

            background-color: rgb(0, 130, 220);

        }


        button:active {

            transform: scale(0.95);

        }


        /* TABLET */

        @media (max-width: 768px) {

            .conteiner {
                padding: 15px;
            }

            .retangulo {
                min-height: auto;
                padding: 20px;
            }

            .tela {
                min-height: 160px;
            }

            .botoes {
                gap: 8px;
                margin-top: 20px;
            }

            button {
                min-height: 65px;
                border-radius: 15px;
            }

        }


        /* TELEMÓVEL */

        @media (max-width: 480px) {

            .conteiner {
                padding: 10px;
            }

            .retangulo {
                padding: 10px;
            }

            .tela {
                min-height: 140px;
                border-radius: 15px;
                padding: 15px;
            }

            .botoes {
                gap: 6px;
                margin-top: 15px;
            }

            button {
                min-height: 60px;
                border-radius: 12px;
                font-size: 20px;
            }

        }


        /* TELEMÓVEL MUITO PEQUENO */

        @media (max-width: 350px) {

            .conteiner {
                padding: 5px;
            }

            .retangulo {
                padding: 5px;
            }

            .tela {
                min-height: 120px;
                padding: 10px;
            }

            .botoes {
                gap: 5px;
            }

            button {
                min-height: 52px;
                border-radius: 10px;
                font-size: 17px;
            }

        }

    </style>
</head>


<body>

    <div class="conteiner">

        <div class="retangulo">

            <div class="tela">

                <p class="calculo" id="calculo">
                    calculo
                </p>

                <p class="resultado" id="resultado">
                    resultado
                </p>

            </div>


            <div class="botoes">

                <button onclick="escrever(7)">7</button>

                <button onclick="escrever(8)">8</button>

                <button onclick="escrever(9)">9</button>

                <button onclick="operacao('÷')">÷</button>


                <button onclick="escrever(4)">4</button>

                <button onclick="escrever(5)">5</button>

                <button onclick="escrever(6)">6</button>

                <button onclick="operacao('×')">×</button>


                <button onclick="escrever(1)">1</button>

                <button onclick="escrever(2)">2</button>

                <button onclick="escrever(3)">3</button>

                <button onclick="operacao('-')">-</button>


                <button onclick="escrever(0)">0</button>

                <button onclick="escrever('.')">.</button>

                <button onclick="calcular()">=</button>

                <button onclick="operacao('+')">+</button>

            </div>

        </div>

    </div>



    <script>

        let numeroAtual = "";

        let numeroAnterior = "";

        let operador = "";

        let novoNumero = true;



        // ESCREVER NÚMEROS NA TELA

        function escrever(numero) {

            const tela = document.getElementById("calculo");


            if (novoNumero) {

                numeroAtual = "";

                novoNumero = false;

            }


            // Impedir dois pontos

            if (numero === "." && numeroAtual.includes(".")) {

                return;

            }


            numeroAtual += numero;


            tela.textContent = numeroAtual;

        }



        // ESCOLHER A OPERAÇÃO

        function operacao(op) {

            if (numeroAtual === "") {

                return;

            }


            numeroAnterior = numeroAtual;

            operador = op;

            novoNumero = true;


            document.getElementById("calculo").textContent =

                numeroAnterior + " " + operador;

        }



        // CALCULAR O RESULTADO

        function calcular() {

            if (

                numeroAnterior === "" ||

                numeroAtual === "" ||

                operador === ""

            ) {

                return;

            }


            let numero1 = Number(numeroAnterior);

            let numero2 = Number(numeroAtual);

            let resultado;



            if (operador === "+") {

                resultado = numero1 + numero2;

            }

            else if (operador === "-") {

                resultado = numero1 - numero2;

            }

            else if (operador === "×") {

                resultado = numero1 * numero2;

            }

            else if (operador === "÷") {


                if (numero2 === 0) {

                    document.getElementById("resultado").textContent =

                        "Erro";

                    return;

                }


                resultado = numero1 / numero2;

            }



            // MOSTRAR RESULTADO

            document.getElementById("resultado").textContent =

                resultado;



            // MOSTRAR EXPRESSÃO

            document.getElementById("calculo").textContent =

                numeroAnterior +

                " " +

                operador +

                " " +

                numeroAtual +

                " =";



            // PREPARAR PARA NOVA OPERAÇÃO

            numeroAtual = resultado.toString();

            numeroAnterior = "";

            operador = "";

            novoNumero = true;

        }

    </script>

</body>

</html>
